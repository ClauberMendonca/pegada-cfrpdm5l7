# Prévia do Pegada: app separado, com a própria base de testes.
# Desliga sozinha quando ninguém usa e liga no primeiro acesso.
app = "pegada-previa"
primary_region = "gru" # São Paulo

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "pegada_previa_dados"
  destination = "/pb_data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
