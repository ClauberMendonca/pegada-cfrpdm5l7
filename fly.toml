# App publicado do Pegada no Fly.io. Publicação: veja .github/workflows/publicar.yml
# Troque o nome do app se "pegada-app" já estiver em uso no Fly.io.
app = "pegada-app"
primary_region = "gru" # São Paulo

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "pegada_dados"
  destination = "/pb_data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
